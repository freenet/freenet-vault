[package]
name = "river-vault"
description = "The River vault: freenet-vault built with River's domain constants"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["freenet-main-delegate"]
# Emits the delegate's WASM entry point (freenet-stdlib's `#[delegate]`).
freenet-main-delegate = []
# Named by the `#[delegate]` macro's generated code; unused here.
trace = []
# Allows building with the PLACEHOLDER author key (`RIVER_VAULT_AUTHOR_VK`),
# which anyone can sign with. Without this feature the crate refuses to compile
# while the placeholder is in place, so a plain `cargo build --release` can
# never produce a vault whose records anyone can forge. Tests, clippy and
# development builds name it explicitly; a release never does.
placeholder-key = []

[dependencies]
freenet-vault.workspace = true
freenet-vault-common.workspace = true
freenet-stdlib.workspace = true

[dev-dependencies]
freenet-vault = { workspace = true, features = ["testing"] }
ed25519-dalek.workspace = true
bs58 = "0.5"
