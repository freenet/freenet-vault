[workspace]
resolver = "2"
members = [
    "crates/freenet-vault-common",
    "crates/freenet-vault",
    "domains/river",
    "crates/freenet-vault-model",
    "crates/freenet-vault-conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-only"
repository = "https://github.com/freenet/freenet-vault"
publish = false

[workspace.dependencies]
blake3 = "1.5.3"
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["fast", "zeroize"] }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
sha2 = { version = "0.10.8", default-features = false }
zeroize = "1"
serde_json = "1"
# `contract` exposes the host random source (`freenet_stdlib::rand`) and the
# native stubs the `#[delegate]` entry point needs.
freenet-stdlib = { version = "0.12.1", features = ["contract"] }
freenet-vault-common = { path = "crates/freenet-vault-common" }
freenet-vault = { path = "crates/freenet-vault" }

# The conformance runner unwinds out of the library on a simulated crash, so
# it needs unwinding; run it with `--profile conformance`.
[profile.conformance]
inherits = "release"
panic = "unwind"
opt-level = 3
lto = false
codegen-units = 16

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# `cargo test` runs the conformance gate over the library and the model, which
# hash, sign and verify records for every simulated hop. Unoptimised, that took
# 691 s; these packages (and the crypto they call) are optimised in the dev
# profile so CI runs it in a couple of minutes. Debug assertions and overflow
# checks stay on, and the release and wasm profiles are untouched.
[profile.dev.package.freenet-vault-common]
opt-level = 3
[profile.dev.package.freenet-vault]
opt-level = 3
[profile.dev.package.freenet-vault-model]
opt-level = 3
[profile.dev.package.freenet-vault-conformance]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.x25519-dalek]
opt-level = 3
